name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version matches tag
        run: |
          version="$(tr -d '\n' < VERSION)"
          if [ "v${version}" != "${{ github.ref_name }}" ]; then
            echo "VERSION (${version}) does not match tag (${{ github.ref_name }})" >&2
            exit 1
          fi

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: ./build.sh

      - name: Package app bundle
        run: ditto -c -k --keepParent dist/JMacTool.app "dist/JMacTool-${{ github.ref_name }}-macos.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          --title "JMacTool ${{ github.ref_name }}"
          --generate-notes
          "dist/JMacTool-${{ github.ref_name }}-macos.zip"
